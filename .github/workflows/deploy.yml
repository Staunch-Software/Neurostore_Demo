name: Deploy NeuroStore
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /home/AdminDeveloper/Neurostore_Demo
            mkdir -p /home/AdminDeveloper/db-backups
            cp Backend/neurostore.db /home/AdminDeveloper/db-backups/neurostore-$(date +%Y%m%d-%H%M%S).db
            ls -1t /home/AdminDeveloper/db-backups/*.db | tail -n +31 | xargs -r rm --
            cp Backend/neurostore.db /tmp/neurostore.db.keep
            git fetch origin
            git reset --hard origin/main
            cp /tmp/neurostore.db.keep Backend/neurostore.db
            cd Frontend/frontend
            npm install
            npm run build
            test "$(ls -d dist/products/*/ 2>/dev/null | wc -l)" -ge 150 || { echo "Prerender produced too few pages, aborting"; exit 1; }
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo chmod -R 755 /var/www/html
            sudo chown -R www-data:www-data /var/www/html
            pm2 restart demo-app --update-env
            pm2 save
            sudo systemctl restart nginx
            echo "Deployment complete!"